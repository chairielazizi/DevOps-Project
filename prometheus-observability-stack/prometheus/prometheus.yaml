
global:
  scrape_interval: 15s
  evaluation_interval: 15s

#alerting targets (Alertmanager)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['__SERVER_IP__:9093']

rules_files:
  - 'alertrules.yaml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    file_sd_configs:
      - files:
          - /'etc/prometheus/targets.json'
        refresh_interval: 30s
